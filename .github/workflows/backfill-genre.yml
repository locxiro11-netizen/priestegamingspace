name: 回填资讯分类

# 给「3A游戏 / 独立游戏」两个子页签上线的那一刻用的：
# 存量资讯没有 genre 字段，子页签会是空的，跑一次这个把历史补齐。
# 新发布的条目由 ai_curate 直接打标，正常不需要再跑第二次。
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 回填缺失的分类
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/backfill_genre.py
